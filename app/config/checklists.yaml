# ============================================================
# ЧЕК-ЛИСТЫ ПРОВЕРКИ ДОКУМЕНТОВ
# Руководитель отдела правит ЭТОТ файл — код менять не нужно.
# После сохранения watcher перечитывает конфиг (hot-reload).
# ============================================================

version: 3
updated: "2026-11-25"
default_checklist: universal

# Тип документа -> чек-лист. Определяется по имени файла и первым строкам текста.
doc_type_rules:
  - type: dogovor_postavki
    match_name: ["договор постав", "dogovor", "поставк"]
    checklist: dogovor
  - type: akt
    match_name: ["акт", "akt", "сверк"]
    checklist: akty
  - type: schet
    match_name: ["счет", "schet", "инвойс", "invoice"]
    checklist: scheta
  - type: sluzhebnaya
    match_name: ["служебн", "заявк", "sluzheb"]
    checklist: sluzhebnye
  - type: default
    checklist: universal

checklists:

  universal:
    title: "Базовые требования ко всем документам"
    requirements:
      - id: U-01
        severity: critical
        text: >
          Документ должен содержать дату составления в формате ДД.ММ.ГГГГ.
      - id: U-02
        severity: critical
        text: >
          Документ должен иметь регистрационный номер (например, № 123/Д-2026).
      - id: U-03
        severity: warning
        text: >
          Должны присутствовать подписи сторон или указание на основание действия по доверенности.
      - id: U-04
        severity: warning
        text: >
          Суммы должны быть указаны и прописью, и цифрами; значения обязаны совпадать.
      - id: U-05
        severity: info
        text: >
          Текст должен быть читаемым, без следов обрывов страниц и «watermark» черновика.

  dogovor:
    title: "Договоры поставки"
    extends: [universal]
    required_requisites:
      - "Наименования обеих сторон с организационно-правовой формой"
      - "Предмет договора (что поставляется)"
      - "Цена и порядок расчетов"
      - "Сроки поставки"
      - "Ответственность сторон / штрафы"
      - "Реквизиты и подписи сторон"
    calculations:
      - id: C-01
        rule: "Итог по таблице = сумма позиций таблицы"
        tolerance_rub: 0.50
      - id: C-02
        rule: "НДС 20% начислен от суммы без НДС; строка 'в т.ч. НДС' присутствует"
        tolerance_rub: 1.00
      - id: C-03
        rule: "Сумма цифрами в тексте = Итого в таблице (= сумма строк спецификации)"
    regulation_refs:
      - collection: etalony
        query: "Положение о договорной работе обязательные пункты"
        top_k: 8
    extra_checks:
      - id: D-01
        severity: critical
        text: >
          Проверить наличие приложения со спецификацией/таблицей позиций; если в тексте
          упоминается Приложение №1, оно должно присутствовать в документе.
      - id: D-02
        severity: warning
        text: >
          Валюта договора — рубли (или явно указано иное согласование).

  akty:
    title: "Акты выполненных работ / сверки"
    extends: [universal]
    required_requisites:
      - "Номер и дата акта"
      - "Основание (номер договора)"
      - "Перечень работ/услуг с единицами измерения"
      - "Итоговая сумма"
      - "Подписи обеих сторон с расшифровкой (должность, ФИО)"
    calculations:
      - id: C-10
        rule: "Стоимость строки = количество × цена за единицу"
        tolerance_rub: 0.01
      - id: C-11
        rule: "Итого = сумма строк; расхождение с текстом недопустимо"
        tolerance_rub: 0.01
    regulation_refs:
      - collection: etalony
        query: "Порядок подписания актов выполненных работ"
        top_k: 6

  scheta:
    title: "Счета на оплату"
    extends: [universal]
    required_requisites:
      - "Номер и дата счета"
      - "ИНН/КПП продавца и покупателя"
      - "Банковские реквизиты продавца"
      - "Срок оплаты"
      - "Назначение платежа"
    calculations:
      - id: C-20
        rule: "Итого к оплате = сумма без НДС + НДС; пересчитать по таблице"
        tolerance_rub: 0.01
    regulation_refs:
      - collection: etalony
        query: "Требования к счетам на оплату бухгалтерия"
        top_k: 6

  sluzhebnye:
    title: "Служебные записки и заявки"
    extends: [universal]
    required_requisites:
      - "Адресат (должность, ФИО)"
      - "Автор (подразделение, ФИО)"
      - "Суть просьбы/обоснование"
      - "Согласование руководителя подразделения"
    regulation_refs:
      - collection: etalony
        query: "Служебные завки порядок оформления"
        top_k: 4
